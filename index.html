<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرة القوائم وصفوف البيانات | ثالث متوسط</title><style>
:root{--p:#6d4fd2;--pink:#e64791;--ink:#24314f;--bg:#f6f5fc;--muted:#71809c;--green:#148763}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(115deg,#523bb1,#a04fc2);color:white;padding:22px 5%;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}header h1{font-size:clamp(18px,2.6vw,28px);margin:0 0 6px}header small{opacity:.88}header button{background:#ffffff26;border:1px solid #ffffff70;color:white}.wrap{max-width:1080px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e7e4f2;border-radius:19px;padding:24px;box-shadow:0 8px 30px #473c7a0d;margin-bottom:18px}h2{margin:0 0 14px}h3{margin:0 0 12px}p{line-height:1.9}button,input,select{font:inherit}button{cursor:pointer;border:0;background:var(--p);color:white;border-radius:11px;padding:11px 17px;font-weight:bold}button:hover{filter:brightness(.95)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eeeafa;color:#5942ae}.outline{background:white;border:1px solid #c7beeb;color:#5545a7}.danger{background:#ffedf0;color:#a43857}input{width:100%;padding:12px;border:1px solid #d7d4e5;border-radius:10px;margin:7px 0 13px;outline-color:var(--p)}label{font-size:14px;font-weight:bold}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.pill{display:inline-block;padding:6px 10px;background:#f0e9ff;color:#6545b2;border-radius:20px;font-size:12px}.progress{height:13px;background:#edeaf6;border-radius:100px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#9475df,#19b8a1);transition:width .35s}.stage{border:1px solid #e4dff4;border-radius:13px;padding:15px;background:#fdfcff}.stage.active{border-color:#8062d7;background:#f7f2ff}.stage.done{border-color:#8fdfc8;background:#f3fcf9}.muted{color:var(--muted);font-size:14px}.code{direction:ltr;text-align:left;unicode-bidi:plaintext;background:#20263c;color:#e5f2ff;padding:19px;border-radius:13px;font:15px/1.8 Consolas,monospace;white-space:pre-wrap;overflow:auto}.sample{background:#f0f7ff;padding:16px;border-radius:12px;margin:14px 0}.option{display:block;text-align:right;width:100%;margin:8px 0;background:#f7f5fb;color:var(--ink);border:1px solid #dad6e9}.option.selected{background:#e8e0fc;border-color:#795bd4}.feedback{padding:12px;border-radius:10px;background:#eafaf4;color:#116e4d;margin:10px 0}.feedback.bad{background:#fff0f1;color:#af3f52}.hide{display:none!important}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:right;border-bottom:1px solid #eee}th{background:#f1ecfc} .scroll{overflow-x:auto}.center{text-align:center}.big{font-size:38px}.note{border-right:4px solid #d59636;background:#fff7e9;padding:12px;margin:14px 0;line-height:1.8}.tiny{font-size:12px}.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.quizbox{margin-top:20px;padding:18px;border:1px dashed #b5a6df;border-radius:14px}.muted-btn{color:#6f62a3;text-decoration:underline;background:none;padding:8px}footer{color:#75809a;text-align:center;margin:36px 0;font-size:12px}@media(max-width:560px){.card{padding:16px}header{padding:18px}td,th{padding:8px;font-size:12px}}
</style></head><body><header><div><h1>🧠 مغامرة القوائم وصفوف البيانات</h1><small>المهارات الرقمية | الصف الثالث المتوسط | الوحدة الرابعة – الدرس الأول</small></div><div id="headerActions"></div></header><main id="app" class="wrap"></main><footer>محتوى تعليمي مبني على صفحات الدرس المرفقة (133–144) • نموذج تعليمي</footer><script src="firebase-config.js"></script><script>
const STAGES=[
{title:'هياكل البيانات',desc:'أنواع البيانات البسيطة وغير البسيطة',content:`<p>هياكل البيانات وسيلة لتنظيم البيانات وتخزينها. وتنقسم إلى <b>بسيطة</b> (أعداد، نصوص، قيم منطقية) و<b>غير بسيطة</b>. وتشمل غير البسيطة هياكل خطية مثل القوائم وصفوف البيانات، وهياكل غير خطية مثل الأشجار والمخططات.</p><div class="sample">💡 مثال: عدد الطالبات قيمة رقمية، واسم الطالبة قيمة نصية، أما قائمة أسماء الطالبات فهي هيكل بيانات يجمع عدة قيم.</div>`,q:'أي مما يأتي يعد هيكل بيانات خطيًا؟',a:['الشجرة','القائمة List','المخطط Graph'],correct:1,explain:'القائمة وصف البيانات من الهياكل الخطية.'},
{title:'إنشاء القوائم والتكرار',desc:'الأقواس المربعة وعناصر القائمة',content:`<p>القائمة <b>List</b> سلسلة مرتبة من العناصر، تُكتب داخل أقواس مربعة <b dir="ltr">[ ]</b>، وتفصل الفواصل بين عناصرها. ويمكن أن تضم عناصر من أنواع مختلفة.</p><div class="code">fruits = ["apple", "orange", "banana"]\nfor f in fruits:\n    print(f)</div><p>يطبع التكرار <b>for</b> كل عنصر في سطر مستقل.</p>`,q:'ما الأقواس المستخدمة لتعريف القائمة في بايثون؟',a:['( )','[ ]','{ }'],correct:1,explain:'تُكتب عناصر القوائم بين أقواس مربعة.'},
{title:'فهرسة القوائم',desc:'الفهرسة الموجبة والسالبة وتعديل العناصر',content:`<p>فهرسة القائمة تبدأ من <b>الصفر</b>. ويمكن الوصول إلى العنصر الأخير بالفهرس <b>‎-1</b>، كما يمكن تعديل عناصر القائمة.</p><div class="code">fruits = ["apple", "orange", "banana"]\nprint(fruits[2])   # banana\nprint(fruits[-1])  # banana\nfruits[1] = "grape"</div>`,q:'ما ناتج fruits[-2] عندما تكون القائمة ["apple", "orange", "banana"]؟',a:['apple','orange','banana'],correct:1,explain:'الفهرس ‎-1 هو الأخير، و‎-2 هو قبل الأخير.'},
{title:'الدوال الجاهزة للقوائم',desc:'len و sum و max و min',content:`<p><b>len()</b> تعيد عدد العناصر، و<b>sum()</b> مجموع الأعداد، و<b>max()</b> أكبر قيمة، و<b>min()</b> أصغر قيمة.</p><div class="code">grades = [89, 88, 98, 95]\nprint(len(grades))  # 4\nprint(sum(grades))  # 370\nprint(max(grades))  # 98\nprint(min(grades))  # 88</div><p class="muted">تتعامل sum مع القيم العددية، ولا يمكن مقارنة الأرقام والنصوص المختلطة مباشرة باستخدام max أو min في بايثون 3.</p>`,q:'ما ناتج sum([10, 20, 30])؟',a:['3','30','60'],correct:2,explain:'الدالة sum تجمع القيم: 10 + 20 + 30 = 60.'},
{title:'تعديل القوائم بالدوال',desc:'append و remove و count و sort و reverse و clear',content:`<p><b>append(x)</b> لإضافة عنصر، و<b>remove(x)</b> لحذف أول عنصر مطابق، و<b>count(x)</b> لعد تكراره. <b>sort()</b> للترتيب التصاعدي و<b>reverse()</b> لعكس ترتيب العناصر الحالي، و<b>clear()</b> لتفريغ القائمة.</p><div class="code">grades = [89, 88, 98, 95]\ngrades.append(100)\ngrades.remove(88)\ngrades.sort()\nprint(grades)\n# [89, 95, 98, 100]</div>`,q:'أي دالة تحذف جميع عناصر القائمة؟',a:['clear()','count()','append()'],correct:0,explain:'clear() تجعل القائمة فارغة.'},
{title:'صفوف البيانات Tuple',desc:'الأقواس الدائرية والفهرسة وعدم قابلية التعديل',content:`<p>صف البيانات <b>Tuple</b> مجموعة مرتبة من العناصر تُكتب عادة بين أقواس دائرية <b dir="ltr">( )</b>، ويمكن فهرستها مثل القائمة، ولكن <b>لا يمكن تعديل عناصرها</b> بعد إنشائها.</p><div class="code">info = ("Khaled", "khaled@edu.sa", 1234)\nprint(info[0])  # Khaled\n# info[0] = "Saad"  ← يسبب TypeError</div>`,q:'ماذا يحدث عند محاولة تغيير info[0] في صف بيانات Tuple؟',a:['يتغير العنصر','تظهر رسالة خطأ','يُحذف الصف'],correct:1,explain:'الصف Tuple غير قابل للتعديل.'},
{title:'مقارنة وتحدي ختامي',desc:'تمييز القائمة عن الصف وتطبيق المفاهيم',content:`<div class="grid"><div class="sample"><h3>القائمة List</h3><div class="code">colors = ["red", "blue"]</div><p>أقواس مربعة وقابلة للتعديل.</p></div><div class="sample"><h3>الصف Tuple</h3><div class="code">colors = ("red", "blue")</div><p>أقواس دائرية وغير قابل للتعديل.</p></div></div><p>فكري: عندما نحتاج إلى تعديل الدرجات نختار القائمة، أما إذا أردنا الاحتفاظ بقيم ثابتة لا نعدلها فنختار الصف.</p>`,q:'ما الاختيار الأنسب لبيانات تحتاجين لإضافة عناصر جديدة إليها باستمرار؟',a:['Tuple','List','كلاهما يتيح append'],correct:1,explain:'القائمة قابلة للتعديل ويمكن إضافة عناصر باستخدام append.'}
];
const app=document.getElementById('app'),actions=document.getElementById('headerActions');let store=null,session=null,selected=null,cloud=null,unsub=null;
const FIREBASE_CONFIG=window.LESSON_FIREBASE_CONFIG||null;const TEACHER_UID=window.LESSON_TEACHER_UID||'';
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localLoad(){return JSON.parse(localStorage.getItem('lesson_91_demo')||'{"profiles":{},"progress":{}}')}function localSave(){localStorage.setItem('lesson_91_demo',JSON.stringify(store))}function status(){return cloud?'☁️ المزامنة السحابية مفعّلة':'⚠️ لم يُفعّل الربط السحابي بعد'}function pct(a){return Math.round((a?.completed?.length||0)/STAGES.length*100)}function msg(s,bad=false){return `<div class="feedback ${bad?'bad':''}">${safe(s)}</div>`}function nav(){actions.innerHTML=session?`<span class="tiny">${safe(session.name)} | ${status()}</span> <button onclick="logout()">خروج</button>`:`<span class="tiny">${status()}</span>`}
async function init(){store=localLoad();if(FIREBASE_CONFIG?.apiKey&&TEACHER_UID){try{const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut},{getFirestore,doc,setDoc,getDoc,collection,onSnapshot,serverTimestamp}] = await Promise.all([import('https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js')]);let fb=initializeApp(FIREBASE_CONFIG),auth=getAuth(fb),db=getFirestore(fb);cloud={auth,db,doc,setDoc,getDoc,collection,onSnapshot,serverTimestamp,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut};onAuthStateChanged(auth,async user=>{if(user){let profile;if(user.uid===TEACHER_UID){profile={name:'المعلمة',role:'teacher'}}else{try{let r=await getDoc(doc(db,'students',user.uid));profile=r.exists()?r.data():null;}catch(err){app.innerHTML='<div class="card">تعذّر تحميل بيانات الحساب. تأكدي من نشر قواعد Firestore ثم أعيدي المحاولة.</div>';return;}if(!profile){session={uid:user.uid,name:'',role:'student',unclaimed:true};return firstNameView()} }session={uid:user.uid,name:profile.name,role:profile.role};render()}else{session=null;render()}});return}catch(e){console.warn('Cloud unavailable:',e)}}render()}
function render(){nav();if(!session)return loginView();if(session.unclaimed)return firstNameView();if(session.role==='teacher')return teacherView();return studentHome()}
function loginView(){app.innerHTML=`<div class="card" style="max-width:630px;margin:0 auto"><h2>✨ أهلاً بك في رحلة تعلم بايثون</h2><p>تعلمي القوائم وصفوف البيانات في سبع محطات، ثم اختبري فهمك واحصلي على نجوم الإنجاز.</p><div class="note">${cloud?'تم تفعيل الاتصال السحابي. بيانات الدخول محفوظة بواسطة Firebase Authentication.':'الاتصال السحابي غير جاهز. يجب ضبط معرف المعلمة ونشر القواعد قبل دخول الطالبات.'}</div><div class="flex"><button id="studentTab">دخول الطالبة</button><button class="secondary" id="teacherTab">لوحة المعلمة</button></div><div id="loginFields" style="margin-top:18px"></div></div>`;document.getElementById('studentTab').onclick=()=>loginFields('student');document.getElementById('teacherTab').onclick=()=>loginFields('teacher');loginFields('student')}
function loginFields(role){const el=document.getElementById('loginFields');if(!cloud){el.innerHTML='<p>للدخول برمز الطالبة يجب نشر النسخة السحابية وضبط معرف المعلمة.</p>';return}
 if(role==='student'){el.innerHTML=`<h3>دخول الطالبة</h3><p class="muted">أدخلي رقمك المخصص المكون من ست خانات. عند أول دخول سيُطلب منك اسمك الكامل.</p><label>رقم الطالبة</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="مثال: 100321"><button id="doLogin">دخول إلى الدرس</button><div id="loginMsg"></div>`;document.getElementById('doLogin').onclick=loginStudent}
 else{el.innerHTML=`<h3>دخول المعلمة</h3><label>البريد الإلكتروني للمعلمة</label><input id="email" type="email" autocomplete="username"><label>كلمة مرور المعلمة</label><input id="pass" type="password" autocomplete="current-password"><button id="doLogin">دخول لوحة المتابعة</button><div id="loginMsg"></div>`;document.getElementById('doLogin').onclick=loginTeacher}}
function codeEmail(code){return 'student-'+code+'@classroom-login.invalid'}
async function loginStudent(){const code=document.getElementById('code').value.trim(),el=document.getElementById('loginMsg');if(!/^\\d{6}$/.test(code)){el.innerHTML=msg('أدخلي رقمًا من ست خانات.',true);return}try{await cloud.signInWithEmailAndPassword(cloud.auth,codeEmail(code),code)}catch(e){try{await cloud.createUserWithEmailAndPassword(cloud.auth,codeEmail(code),code)}catch(createError){el.innerHTML=msg('تعذّر الدخول بهذا الرقم. تأكدي من الرقم أو تواصلي مع المعلمة.',true)}}}
async function loginTeacher(){let el=document.getElementById('loginMsg');try{let r=await cloud.signInWithEmailAndPassword(cloud.auth,document.getElementById('email').value.trim(),document.getElementById('pass').value);if(r.user.uid!==TEACHER_UID){await cloud.signOut(cloud.auth);throw Error('هذا ليس حساب المعلمة')}}catch(e){el.innerHTML=msg('تعذّر الدخول إلى لوحة المعلمة. تحققي من بيانات الحساب.',true)}}
function firstNameView(){nav();app.innerHTML=`<div class="card"><h2>🌸 أهلاً بكِ في أول زيارة</h2><p>اكتبي اسمك الكامل مرة واحدة. في المرات التالية ستحتاجين رقمك فقط.</p><label>الاسم الكامل</label><input id="firstName" maxlength="80" placeholder="الاسم الكامل"><button id="saveFirstName">حفظ الاسم وبدء الدرس</button><div id="firstNameMsg"></div></div>`;document.getElementById('saveFirstName').onclick=async()=>{const name=document.getElementById('firstName').value.trim(),el=document.getElementById('firstNameMsg');if(name.length<5){el.innerHTML=msg('اكتبي اسمك الكامل.',true);return}try{await cloud.setDoc(cloud.doc(cloud.db,'students',session.uid),{name,createdAt:cloud.serverTimestamp()});session={uid:session.uid,name,role:'student'};render()}catch(e){el.innerHTML=msg('تعذر حفظ الاسم. تأكدي من نشر قواعد Firestore الصحيحة.',true)}}}
function logout(){if(unsub){unsub();unsub=null}if(cloud)cloud.signOut(cloud.auth);else{session=null;render()}}
async function getProgress(){if(!cloud)return store.progress[session.uid]||{completed:[],answers:{}};let r=await cloud.getDoc(cloud.doc(cloud.db,'progress',session.uid));return r.exists()?r.data():{completed:[],answers:{}}}
let currentProgress=null;
async function studentHome(){app.innerHTML='<div class="card">جارٍ تحميل تقدمك...</div>';try{currentProgress=await getProgress()}catch(err){app.innerHTML='<div class="card">تعذّر تحميل تقدم الطالبة من قاعدة البيانات. تحققي من قواعد Firestore.</div>';return}let p=currentProgress;app.innerHTML=`<div class="card"><div class="titleline"><div><span class="pill">🌟 رحلة التعلم</span><h2 style="margin-top:10px">مرحبًا ${safe(session.name)}!</h2><p class="muted">أنجزي المحطات بالترتيب. يُحفظ تقدمك بعد إجابة كل سؤال إجابة صحيحة.</p></div><div class="center"><div class="big">${pct(p)}%</div><b>نسبة الإنجاز</b></div></div><div class="progress"><div class="bar" style="width:${pct(p)}%"></div></div><p>المحطات المكتملة: ${p.completed.length} من ${STAGES.length} • مجموع النقاط: ${p.completed.length*10} / ${STAGES.length*10}</p></div><div class="grid">${STAGES.map((s,i)=>{let done=p.completed.includes(i),available=done||i===0||p.completed.includes(i-1);return `<div class="stage ${done?'done':available?'active':''}"><div class="titleline"><b>المحطة ${i+1}</b><span class="pill">${done?'✅ مكتملة':available?'🔓 متاحة':'🔒 مقفلة'}</span></div><h3 style="margin-top:10px">${s.title}</h3><p class="muted">${s.desc}</p><button ${!available?'disabled':''} onclick="openStage(${i})">${done?'مراجعة المحطة':available?'ابدئي المحطة':'أكملي السابقة أولًا'}</button></div>`}).join('')}</div>${pct(p)===100?'<div class="card center"><div class="big">🏆</div><h2>أحسنتِ! أكملتِ الدرس</h2><p>أنجزتِ جميع المحطات السبع بنجاح.</p><button onclick="window.print()">طباعة صفحة الإنجاز</button></div>':''}`}
function openStage(i){if(!currentProgress.completed.includes(i)&&i>0&&!currentProgress.completed.includes(i-1))return;selected=null;let s=STAGES[i];app.innerHTML=`<div class="card"><button class="secondary" onclick="studentHome()">↩ العودة للمحطات</button><p class="pill">المحطة ${i+1} من ${STAGES.length}</p><h2>${s.title}</h2><p class="muted">${s.desc}</p>${s.content}${i===2?'<div class="sample"><b>جربي بنفسك:</b> اضغطي على أحد الفهارس لتري العنصر الموافق له.<div class="flex" style="margin-top:12px"><button class="outline" onclick="document.getElementById(\'indexResult\').textContent=\'apple\'">fruits[0]</button><button class="outline" onclick="document.getElementById(\'indexResult\').textContent=\'banana\'">fruits[-1]</button><button class="outline" onclick="document.getElementById(\'indexResult\').textContent=\'orange\'">fruits[1]</button></div><p>الناتج: <b id="indexResult">—</b></p></div>':''}${i===4?'<div class="sample"><b>تجربة الدوال:</b> <button class="outline" onclick="listDemo(\'append\')">append(100)</button> <button class="outline" onclick="listDemo(\'sort\')">sort()</button> <button class="outline" onclick="listDemo(\'reverse\')">reverse()</button> <button class="outline" onclick="listDemo(\'clear\')">clear()</button><div class="code" id="listResult">[89, 88, 98, 95]</div></div>':''}<div class="quizbox"><h3>🎯 تحقق من فهمك (10 نقاط)</h3><p><b>${s.q}</b></p><div id="options">${s.a.map((v,j)=>`<button class="option" onclick="choose(${j},${i})">${safe(v)}</button>`).join('')}</div><div id="answer"></div></div></div>`}
let demoList=[89,88,98,95];function listDemo(op){if(op==='append')demoList.push(100);if(op==='sort')demoList.sort((a,b)=>a-b);if(op==='reverse')demoList.reverse();if(op==='clear')demoList=[];document.getElementById('listResult').textContent=JSON.stringify(demoList)}
function choose(j,i){selected=j;document.querySelectorAll('.option').forEach((b,k)=>b.classList.toggle('selected',k===j));let s=STAGES[i],good=j===s.correct;document.getElementById('answer').innerHTML=msg(good?'إجابة صحيحة! '+s.explain:'حاولي مجددًا. '+s.explain,!good)+(good?`<button id="finishBtn">✅ احفظي الإنجاز وانتقلي</button>`:'');if(good)document.getElementById('finishBtn').onclick=()=>finish(i,j)}
async function finish(i,j){let p=currentProgress;if(!p.completed.includes(i))p.completed.push(i);p.completed.sort((a,b)=>a-b);p.answers={...(p.answers||{}),[i]:j};if(cloud){try{await cloud.setDoc(cloud.doc(cloud.db,'progress',session.uid),{...p,updatedAt:cloud.serverTimestamp()})}catch(e){alert('تعذر حفظ التقدم: '+e.message);return}}else{store.progress[session.uid]=p;localSave()}studentHome()}
function teacherView(){if(unsub){unsub();unsub=null}app.innerHTML=`<div class="card"><div class="titleline"><div><h2>📊 لوحة متابعة المعلمة</h2><p class="muted">${status()} • تظهر الطالبات ونسبة إنجازهن ومرحلة التعلم</p></div><button class="secondary" onclick="exportCSV()">⬇ تصدير تقرير CSV</button></div><div id="teacherData">جارٍ جلب البيانات...</div></div>`;if(cloud){let profiles={},progress={};let fn=()=>drawTeacher(profiles,progress);const u1=cloud.onSnapshot(cloud.collection(cloud.db,'students'),s=>{profiles={};s.forEach(d=>profiles[d.id]=d.data());fn()},e=>document.getElementById('teacherData').innerHTML=msg(e.message,true));const u2=cloud.onSnapshot(cloud.collection(cloud.db,'progress'),s=>{progress={};s.forEach(d=>progress[d.id]=d.data());fn()},e=>document.getElementById('teacherData').innerHTML=msg(e.message,true));unsub=()=>{u1();u2()}}else drawTeacher(store.profiles,store.progress)}
let teacherRows=[];function drawTeacher(profiles,progress){teacherRows=Object.entries(profiles).map(([id,v])=>{let p=progress[id]||{completed:[]};let next=STAGES.findIndex((s,i)=>!p.completed.includes(i));return {name:v.name||'غير معروف',count:p.completed.length,percent:pct(p),next:next<0?'أكملت الدرس':STAGES[next].title,score:p.completed.length*10}}).sort((a,b)=>b.percent-a.percent);let n=teacherRows.length,done=teacherRows.filter(x=>x.percent===100).length,avg=n?Math.round(teacherRows.reduce((v,x)=>v+x.percent,0)/n):0;let el=document.getElementById('teacherData');if(!el)return;el.innerHTML=`<div class="grid"><div class="sample"><div class="big">${n}</div>الطالبات المسجلات</div><div class="sample"><div class="big">${done}</div>أكملن الدرس</div><div class="sample"><div class="big">${avg}%</div>متوسط الإنجاز</div></div><div class="scroll"><table><thead><tr><th>الطالبة</th><th>المحطات</th><th>الإنجاز</th><th>المرحلة الحالية</th><th>النقاط</th></tr></thead><tbody>${teacherRows.map(r=>`<tr><td>${safe(r.name)}</td><td>${r.count}/${STAGES.length}</td><td><b>${r.percent}%</b><div class="progress" style="min-width:80px"><div class="bar" style="width:${r.percent}%"></div></div></td><td>${safe(r.next)}</td><td>${r.score}/70</td></tr>`).join('')||'<tr><td colspan="5">لم تسجل طالبات بعد.</td></tr>'}</tbody></table></div><p class="muted">تعني «مكتملة» إجابة صحيحة على سؤال تحقق واحد في كل محطة. لا تقيس نسبة الإنجاز زمن القراءة أو الإتقان الشامل.</p>`}
function exportCSV(){let rows=[['اسم الطالبة','المحطات المكتملة','نسبة الإنجاز','المرحلة الحالية','النقاط'],...teacherRows.map(r=>[r.name,r.count,r.percent+'%',r.next,r.score])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='تقرير_إنجاز_القوائم_والصفوف.csv';a.click();URL.revokeObjectURL(a.href)}
init();
</script></body></html>
